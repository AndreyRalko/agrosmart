upstream app {
    server backend:8000;
}

server {
    listen 80;
    server_name default;

    location /media/ {
            alias /media/;
            try_files $uri $uri/ =404;
    }

    location /static/ {
            alias /static/;
            try_files $uri $uri/ =404;
    }

    location / {
            include proxy_params;
            proxy_pass http://app;
    }
}
