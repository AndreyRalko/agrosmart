services:
  backend:
    build: .
    volumes:
      - backend-media:/app/media
      - backend-static:/app/static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000/health/" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
  nginx:
    image: nginx:1.29
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - backend-media:/media
      - backend-static:/static
      - ./_infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./_infrastructure/nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-media:
  backend-static: